<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"><rect width="720" height="470" rx="18" fill="#f6f5f1"/><g font-family="Arial,sans-serif" fill="#1c2733"><rect x="35" y="28" width="650" height="408" rx="20" fill="white" stroke="#ddd"/><rect x="61" y="51" width="125" height="49" rx="10" fill="#fff3d8" stroke="#F4B02E" stroke-width="3"/><text x="80" y="82" font-size="24" font-weight="700">&lt;/&gt; Code</text><circle cx="213" cy="76" r="18" fill="#0A2547"/><text x="207" y="83" font-size="20" fill="white">1</text><text x="65" y="153" font-size="22">Start a local coding session</text><text x="65" y="201" font-size="17" fill="#5f6b7a">These controls sit above the message box:</text><rect x="65" y="236" width="135" height="52" rx="9" fill="#fff3d8" stroke="#F4B02E" stroke-width="3"/><text x="98" y="270" font-size="24">Local</text><rect x="220" y="236" width="211" height="52" rx="9" fill="#fff3d8" stroke="#F4B02E" stroke-width="3"/><text x="236" y="270" font-size="23">Select folder</text><circle cx="132" cy="216" r="18" fill="#0A2547"/><text x="126" y="223" font-size="20" fill="white">2</text><circle cx="325" cy="216" r="18" fill="#0A2547"/><text x="319" y="223" font-size="20" fill="white">3</text><text x="65" y="326" font-size="18">Click the folder name (or “Select folder”)</text><rect x="65" y="350" width="590" height="58" rx="12" fill="#fafafa" stroke="#ddd"/><text x="85" y="386" font-size="19" fill="#5f6b7a">Paste your prompt here after choosing the folder</text></g></svg>